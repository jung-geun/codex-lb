name: codex-lb

services:
  codex-lb:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${LOCAL_IMAGE:-codex-lb-local:1.25.0b9-provider-quota}
    container_name: codex-lb
    ports:
      - "${CODEX_LB_BIND_ADDRESS:-127.0.0.1}:2455:2455"
      - "${CODEX_LB_BIND_ADDRESS:-127.0.0.1}:1455:1455"
    volumes:
      - codex-lb-data:/var/lib/codex-lb
    networks:
      - codex-lb-net
      - backend
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - /opt/venv/bin/python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:2455/health/ready", timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  codex-lb-data:
    external: true
    name: codex-lb-data

networks:
  codex-lb-net:
    external: true
    name: codex-lb-net
  backend:
    external: true
    name: backend
